<!-- @dsCard group="Display" height=150 -->
<div class="pm" style="padding:20px;background:var(--bg);min-height:100%">
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <small style="color:var(--muted);width:120px">By category</small>
  <span class="pill pill--todo"><i></i>To do</span>
  <span class="pill pill--progress"><i></i>In progress</span>
  <span class="pill pill--done"><i></i>Done</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">
  <small style="color:var(--muted);width:120px">Custom colour</small>
  <span class="pill pill--slate"><i></i>Backlog</span>
  <span class="pill pill--cobalt"><i></i>In review</span>
  <span class="pill pill--teal"><i></i>QA</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">
  <small style="color:var(--muted);width:120px">Signals and tags</small>
  <span class="pill pill--bad"><i></i>Overdue</span>
  <span class="pill pill--warn"><i></i>Due soon</span>
  <span class="pill pill--coral">bug</span>
  <span class="pill pill--teal">api</span>
  <span class="pill pill--sand">docs</span>
</div>
</div>
