<!-- @dsCard group="Overlays" height=330 -->
<div class="pm" style="padding:20px;background:var(--bg);min-height:100%;display:grid;place-items:center">
<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pl-t" style="--c:var(--c-amber);--t:var(--t-amber)">
  <span class="dialog__icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .6 3 2.6 3 6"/></svg></span>
  <h2 class="dialog__title" id="pl-t">You've used all 10 seats</h2>
  <p class="dialog__body">Inviting Priya needs one more seat on the Team plan. Agents don't use seats.</p>
  <div class="progress" role="progressbar" aria-valuenow="10" aria-valuemin="0" aria-valuemax="10" aria-valuetext="10 of 10 seats"><i style="width:100%;background:var(--c-amber)"></i></div>
  <div class="dialog__foot"><button class="btn btn--ghost">Manage members</button><button class="btn btn--primary">Upgrade plan</button></div>
</div>
</div>
