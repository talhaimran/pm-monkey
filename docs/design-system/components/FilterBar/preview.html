<!-- @dsCard group="Search" height=150 -->
<div class="pm" style="padding:20px;background:var(--bg);min-height:100%">
<div class="fbar">
  <label class="search" style="width:220px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg><input class="input" placeholder="Filter issues" aria-label="Filter issues"></label>
  <span class="fchip"><span class="fchip__key">Assignee</span><button class="fchip__val">Talha, Sam</button><button class="fchip__x" aria-label="Remove Assignee filter"><svg class="ico" viewBox="0 0 24 24" style="width:14px;height:14px" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
  <span class="fchip"><span class="fchip__key">Type</span><button class="fchip__val">Bug</button><button class="fchip__x" aria-label="Remove Type filter"><svg class="ico" viewBox="0 0 24 24" style="width:14px;height:14px" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
  <span class="fchip"><span class="fchip__key">Status</span><button class="fchip__val">is not Done</button><button class="fchip__x" aria-label="Remove Status filter"><svg class="ico" viewBox="0 0 24 24" style="width:14px;height:14px" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
  <button class="btn btn--ghost btn--sm"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add filter</button>
  <span style="margin-left:auto;display:flex;gap:6px"><button class="btn btn--ghost btn--sm">Clear</button><button class="btn btn--sm">Save view</button></span>
</div>
<div style="margin-top:10px;display:flex;gap:8px"><button class="chip is-on" aria-pressed="true">Only my issues</button><button class="chip" aria-pressed="false">Recently updated</button></div>
</div>
