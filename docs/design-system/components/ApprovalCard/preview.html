<!-- @dsCard group="Agents" height=330 -->
<div class="pm" style="padding:20px;background:var(--bg);min-height:100%;display:grid;gap:12px;max-width:460px">
<div class="approval">
  <div class="approval__head"><span class="av av--xs av--agent" aria-hidden="true">AI</span>Triage agent (AI) wants to change PM-142<small>Expires in 6 days</small></div>
  <div class="approval__move"><span class="pill pill--progress"><i></i>In Progress</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="pill pill--done"><i></i>Done</span></div>
  <div style="font-size:13px">The linked pull request merged and all checks passed.</div>
  <div class="approval__foot"><button class="btn btn--primary btn--sm">Approve</button><button class="btn btn--ghost btn--sm">Reject</button><button class="btn btn--ghost btn--sm" style="margin-left:auto">View details</button></div>
</div>
<div class="approval is-stale">
  <div class="approval__head"><span class="av av--xs av--agent" aria-hidden="true">AI</span>Planning agent (AI) wants to set the estimate<small>Expires in 2 days</small></div>
  <div class="approval__move">Estimate <span class="chg-del">3h</span><span class="chg-add">6h</span></div>
  <div style="font-size:13px;font-weight:600">PM-118 changed since. Review before approving.</div>
  <div class="approval__foot"><button class="btn btn--primary btn--sm">Review</button><button class="btn btn--ghost btn--sm">Reject</button></div>
</div>
</div>
