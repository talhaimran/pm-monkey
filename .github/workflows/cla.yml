name: CLA

# Asks each outside contributor to sign CLA.md once, by commenting on their pull request.
# Signatures are stored in signatures/cla.json on the cla-signatures branch.
# pull_request_target runs with this repo's token but never checks out or runs the pull request's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signatures
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the commit of v2.6.1 (Apache-2.0). The upstream repo is archived, so this pin will not move.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/talhaimran/PM-Ops/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: talhaimran,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: true
